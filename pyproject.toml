[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlpgui"
version = "1.1.1"
description = "A macOS GUI for yt-dlp downloads and demucs stem splitting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# tkinter ships with macOS Python — no extra UI dep needed
# yt-dlp's deno extra ships a prebuilt JS runtime that YouTube extraction needs
# demucs imports numpy but only declares it on Intel Macs
dependencies = ["yt-dlp[default,deno]", "demucs>=4.1", "numpy"]

[project.scripts]
ytdlpgui = "ytdlpgui.__main__:main"

[project.optional-dependencies]
dev = ["pyinstaller"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdlpgui*"]
